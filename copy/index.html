<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>0xkhush — Copy</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .copy-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      position: relative;
      z-index: 1;
    }
    .copy-card {
      width: 100%;
      max-width: 720px;
      border: 1px solid var(--line);
      background: #050505;
      box-shadow: 14px 14px 0 var(--orange);
      padding: 32px;
    }
    .copy-kicker {
      font: 11px "DM Mono", monospace;
      letter-spacing: .08em;
      color: var(--orange);
      margin: 0 0 12px;
    }
    .copy-title {
      font-family: "Teko", Impact, sans-serif;
      font-size: clamp(3.5rem, 8vw, 6rem);
      line-height: .85;
      margin: 0 0 24px;
      text-transform: uppercase;
    }
    .copy-link-btn {
      display: inline-block;
      background: var(--orange);
      color: var(--ink);
      font: 500 13px "DM Mono", monospace;
      letter-spacing: .08em;
      padding: 14px 22px;
      margin-bottom: 20px;
      transition: opacity .15s ease;
    }
    .copy-link-btn:hover {
      opacity: .9;
    }
    .copy-raw {
      display: block;
      font: 12px "DM Mono", monospace;
      color: #c6c3bc;
      word-break: break-all;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      text-decoration: underline;
    }
    .copy-raw:hover {
      color: var(--orange);
    }
  </style>
</head>
<body>
  <main>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="/" aria-label="0xkhush home"><span>_</span>0xkhush<span>_</span></a>
      <p class="system-state"><i></i> SYSTEM / ONLINE</p>
      <a class="mail-link" href="/">HOME ↗</a>
    </header>

    <section class="copy-container">
      <div class="copy-card">
        <p class="copy-kicker">// SHARED LINK</p>
        <h1 class="copy-title">DROPBOX <em>FOLDER</em></h1>
        <a class="copy-link-btn" href="https://www.dropbox.com/scl/fo/t2k2jr6ukdvjn9a40o662/AFa2iYDOpujgTy-KP1T3Pyw?rlkey=1ysgeafji3qk7cd88w76yjqwe&amp;st=ghotpkou&amp;dl=0" target="_blank" rel="noopener noreferrer">
          OPEN DROPBOX LINK ↗
        </a>
        <a class="copy-raw" href="https://www.dropbox.com/scl/fo/t2k2jr6ukdvjn9a40o662/AFa2iYDOpujgTy-KP1T3Pyw?rlkey=1ysgeafji3qk7cd88w76yjqwe&amp;st=ghotpkou&amp;dl=0" target="_blank" rel="noopener noreferrer">
          https://www.dropbox.com/scl/fo/t2k2jr6ukdvjn9a40o662/AFa2iYDOpujgTy-KP1T3Pyw?rlkey=1ysgeafji3qk7cd88w76yjqwe&amp;st=ghotpkou&amp;dl=0
        </a>
      </div>
    </section>
  </main>
</body>
</html>
